<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio - ¿Quién quiere ser millonario?</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at center, #002f4b, #000);
  color: white;
  text-align: center;
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.contenedor {
  width: 90%;
  max-width: 800px;
  background: rgba(0,0,0,0.85);
  border: 3px solid gold;
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 0 25px gold;
}
h1 {
  color: gold;
  font-size: 2.2em;
  margin-bottom: 10px;
}
h2 {
  color: #f0f0f0;
  font-weight: normal;
  margin-bottom: 30px;
}
button {
  background: gold;
  color: black;
  border: none;
  padding: 14px 30px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  font-size: 18px;
  margin: 10px;
  transition: 0.3s;
}
button:hover {
  background: #ffdb58;
  transform: scale(1.05);
}
@keyframes fadeInUp {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}
.fade {
  animation: fadeInUp 1s ease forwards;
}
footer {
  position: absolute;
  bottom: 10px;
  width: 100%;
  text-align: center;
  font-size: 14px;
  color: #bbb;
}
</style>
</head>
<body>
  <div class="contenedor fade">
    <h1>¿Quién quiere ser millonario? 💰</h1>
    <h2>Elige un tema para empezar</h2>

    <button onclick="iniciarTema('tema1.html')">🏗️ Tema 1: Operaciones básicas de recogida y tratamiento de residuos municipales e industriales</button>
    <button onclick="iniciarTema('tema2.html')">🌿 Tema 2: Recogida y tratamiento de residuos municipales</button>
    <button onclick="iniciarTema('tema3.html')">🔄 Tema 3: Recogida y tratamiento de residuos industriales</button>
    <button onclick="iniciarTema('tema4.html')">⚖️ Tema 4: Seguridad y salud laboral</button>
  </div>

  <footer>© 2025 | Juego educativo hecho por Juan El Bueno</footer>

  <script>
    function iniciarTema(url) {
      // 🔥 Limpiar toda la memoria guardada
      localStorage.clear();
      sessionStorage.clear();
      
      // Opcional: pequeño retraso visual
      setTimeout(() => {
        window.location.href = url;
      }, 150);
    }
  </script>
</body>
</html>
